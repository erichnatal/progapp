<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD - VENDAS</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<body class="body">
    <div class="form1">
        <h1>Cadastrar nova venda</h1>
        <form id="form">
            <input type="text" placeholder="Nome do produto" id="nomeproduto">
            <input type="text" placeholder="Categoria do produto" id="categoria">
            <input type="text" placeholder="Quantidade vendida" id="qtdvenda">
            <input type="text" placeholder="Preço unitário" id="precounitario">
            <input type="text" placeholder="Valor total da venda" id="valortotal">
            <input type="date" placeholder="Data da venda" id="datavenda" name="data" min="2024-01-01" max="2026-12-31">
            <input type="text" placeholder="Forma de pagamento (Dinheiro, Cartão, Pix)" id="tipopagamento">
            <input type="text" placeholder="Nome do vendedor" id="nomevendedor">
            <button type="submit">Registrar</button>
        </form>
    </div>

    <br>
    <br>
    <br>

    <div class="form2">
        <h1>Editar Venda</h1>
        <form id="formatt">
            <input type="text" id="idatt" placeholder="ID do Produto" disabled>
            <input type="text" placeholder="Nome do produto" id="nomeprodutoatt">
            <input type="text" placeholder="Categoria do produto" id="categoriaatt">
            <input type="text" placeholder="Quantidade vendida" id="qtdvendaatt">
            <input type="text" placeholder="Preço unitário" id="precounitarioatt">
            <input type="text" placeholder="Valor total da venda" id="valortotalatt">
            <input type="date" placeholder="Data da venda" id="dataatt" name="data" min="2024-01-01" max="2026-12-31">
            <input type="text" placeholder="Forma de pagamento (Dinheiro, Cartão, Pix)" id="tipopagamentoatt">
            <input type="text" placeholder="Nome do vendedor" id="nomevendedoratt">
            <button type="submit">Editar venda</button>
        </form>
    </div>
    <br>
    <br>
    <div class="tab">
        <h2>VENDAS</h2>
        <table border="1" class="tabela">
            <thead>
                <tr>
                    <th>ID da Venda</th>
                    <th>Produto</th>
                    <th>Categoria</th>
                    <th>Quantidade Vendida</th>
                    <th>Valor total da venda</th>
                    <th>Data da Venda</th>
                    <th>Forma de Pagamento</th>
                    <th>Nome do Vendedor</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="listaVendas">
                <!-- O conteúdo da tabela virá aqui: Nome, email  -->
            </tbody>
        </table>
    </div>
    <script src="scripts/index.js"></script>
</body>
</html>
